<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amateur Match Organizer</title>
    <style>
      body { margin: 0; background: #b0d8c6; color: #1a2e25; font-family: "Trebuchet MS", sans-serif; }
      main { width: min(100% - 2rem, 42rem); margin: 4rem auto; }
      h1 { font-size: clamp(2.5rem, 8vw, 5rem); line-height: .95; }
      form { display: grid; gap: 1rem; border-left: 5px solid #2ecc71; padding: 2rem; background: white; }
      label { display: grid; gap: .4rem; font-weight: bold; }
      input, select, button { padding: .8rem; font: inherit; }
      button { border: 0; background: #2ecc71; color: white; font-weight: bold; cursor: pointer; }
      #message { min-height: 1.5rem; font-weight: bold; }
      #preview { margin-top: 2rem; border-top: 1px solid #1a2e2533; padding-top: 1rem; }
    </style>
  </head>
  <body>
    <main>
      <p>DAY 1 · MATCH ORGANIZER</p>
      <h1>Football Match Setup</h1>
      <form id="registrationForm" novalidate>
        <label>Player Name <input id="playerName" required minlength="2"></label>
        <label>Phone Number <input id="phone" type="tel" required></label>
        <label>Select Match
          <select id="matchSelect" required>
            <option value="">Choose a match to join</option>
            <option>Thursday Night 5v5</option>
            <option>Saturday Evening</option>
            <option>Friday Morning Turf</option>
          </select>
        </label>
        <button type="submit">Join the Match</button>
        <p id="message" role="status" aria-live="polite"></p>
      </form>
      <section id="preview" aria-live="polite">Complete the form to preview player data.</section>
    </main>
    <script src="registration-form.js"></script>
  </body>
</html>
